name: ci

# What a commit has to prove before it is deployed. Four jobs, because they fail
# for different reasons and a reader wants to know which: `lint` is the shape of
# the code, `test` is what it does, `types` is what it claims, and `image` is that
# the container this repository ships actually builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.5"
  OTP_VERSION: "29.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      # The three engines are Rust: `ex_quiddity`, `ex_cadmpeg` and Monty's own
      # NIF each compile a cdylib when the dependency is built.
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          # `priv/native` travels with the build tree: the compiled `.so` files
          # are gitignored, so a restored `_build` without them makes Mix believe
          # the engines are built while the VM has none, and every tool call then
          # fails with "module ... is not available".
          path: |
            deps
            _build
            priv/native
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/native
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix test

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/native
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-plt-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix dialyzer

  image:
    # The container is an offer this repository makes, so it is built rather than
    # assumed. On a pull request it is skipped: the same Dockerfile runs on the
    # push to main, and a contributor's branch does not need to pay for it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ex-monty-cad-server:ci
