name: ci

# What a commit has to prove before it is deployed. Three jobs, because they fail
# for different reasons and a reader wants to know which: `lint` is the shape of
# the code, `test` is what it does, and `types` is what it claims. The container
# is not built here: it is offered as a Dockerfile, and an image nobody runs in CI
# is a claim rather than a check.
#
# Documentation is its own workflow (`docs.yml`), because it is published rather
# than checked: a failing page should not stop a release the code is fit for.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.5"
  OTP_VERSION: "29.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      # The three engines are Rust: `ex_quiddity`, `ex_cadmpeg` and Monty's own
      # NIF each compile a cdylib when the dependency is built.
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          # `priv/native` travels with the build tree: the compiled `.so` files
          # are gitignored, so a restored `_build` without them makes Mix believe
          # the engines are built while the VM has none, and every tool call then
          # fails with "module ... is not available".
          path: |
            deps
            _build
            priv/native
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      # The tool reference is generated from the catalogue: a description changed
      # in one place and not the other is a page that lies about the server, and
      # this is where that is noticed.
      - run: mix ex_monty_cad_server.tools_doc --check
      # A version edited in `mix.exs` and not in `VERSION` survives until the tag,
      # and then the tag is refused — so the disagreement is caught on the push
      # that made it.
      - run: elixir scripts/release.exs check

  test:
    runs-on: ubuntu-24.04
    # The catalogue is a Postgres table. CI names the service rather than the
    # file-backed default, so the suite exercises what a deployment runs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/native
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix test
      # The two tests that start a second node need a distributed VM, which
      # `mix test` does not start; this one is started with a name. No `--cookie`:
      # the peer inherits the default one, and a cookie only on this side is a
      # peer whose handshake is refused.
      - run: elixir --name cad_ci@127.0.0.1 -S mix test --only distributed

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/native
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
      # The PLTs live under `_build`, not `priv`: `priv/plts` named them where a
      # release copies files from, and a tagged archive then carried them.
      - uses: actions/cache@v4
        with:
          path: _build/plts
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-plt-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix dialyzer
